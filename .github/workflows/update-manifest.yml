name: Update Manifest and Version

on:
  push:
    branches:
      - primary

jobs:
  generate-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install --upgrade pip

      - name: Get current manifest version
        id: version
        run: |
          if [ -f database/manifest.json ]; then
            VERSION=$(jq -r '.version' database/manifest.json)
          else
            VERSION="0.0.0"
          fi
          echo "Current version: $VERSION"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Update manifest version
        run: |
          python scripts/generate_manifest.py
          # Update version field
          jq --arg ver "$NEW_VERSION" '.version=$ver' database/manifest.json > database/manifest.tmp.json
          mv database/manifest.tmp.json database/manifest.json

      - name: Commit and push manifest
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add database/manifest.json
          git commit -m "Auto-update manifest.json to version $NEW_VERSION [skip ci]" || echo "No changes to commit"
          git push origin primary
